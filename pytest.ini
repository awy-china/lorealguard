[pytest]
; canonical 验证命令（在项目根跑）：
;   env -u PYTHONPATH .venv/Scripts/python.exe -m pytest
; PYTHONPATH 必须清：本机它被 Hermes 全局占用，会污染 import。
; ⚠️ 不要再追加 -q：addopts 里已经有一个 -q，双重 -q 会连 "N passed" 汇总行一起吞掉，
;    让验证证据看起来是空白（踩过）。要看明细用 -rf，要计时用 --durations=3。
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:voiceguard.*